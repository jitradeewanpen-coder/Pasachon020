<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milky Mellow Cafe</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f8ff;
    color: #6688ad;
}

/* ส่วนหัว */
header {
    background: white;
    text-align: center;
    padding: 20px;
}

header h1 {
    font-size: 35px;
    color: #789fc8;
}

header p {
    color: #9bb7d5;
    margin-top: 5px;
}

/* ปุ่มนำทาง */
nav {
    background: #dcecff;
    padding: 15px;
    text-align: center;
}

nav a {
    display: inline-block;
    text-decoration: none;
    color: #6386aa;
    background: white;
    padding: 12px 25px;
    margin: 5px;
    border-radius: 25px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover {
    background: #83a9d0;
    color: white;
}

/* แบนเนอร์ */
.banner {
    text-align: center;
    padding: 35px 15px 20px;
}

.banner img {
    width: 90%;
    max-width: 850px;
    height: auto;
    border-radius: 18px;
    box-shadow: 0 5px 15px #d0e1f1;
}

/* ข้อความต้อนรับ */
.welcome {
    text-align: center;
    padding: 25px 15px 55px;
}

.welcome h2 {
    font-size: 30px;
    color: #739bc3;
    margin-bottom: 12px;
}

.welcome p {
    font-size: 17px;
    line-height: 1.8;
    color: #829fbc;
}

/* ท้ายเว็บไซต์ */
footer {
    background: #dcecff;
    text-align: center;
    padding: 20px;
    color: #6688ad;
}
</style>
</head>

<body>

<header>
    <h1>♡ Milky Mellow Cafe ♡</h1>
    <p>Sweet Moments, Happy Days</p>
</header>

<!-- ปุ่ม 5 ปุ่ม -->
<nav>
    <a href="index.html">หน้าแรก</a>
    <a href="drink.html">เครื่องดื่ม</a>
    <a href="cake.html">ขนมและเค้ก</a>
    <a href="promotion.html">โปรโมชั่น</a>
    <a href="contact.html">ติดต่อเรา</a>
</nav>

<!-- รูปหน้าปก -->
<div class="banner">
    <img src="images/banner.jpg" alt="Milky Mellow Cafe">
</div>

<!-- ข้อความต้อนรับ -->
<div class="welcome">
    <h2>Welcome to Milky Mellow ♡</h2>

    <p>
        ยินดีต้อนรับสู่ Milky Mellow Cafe<br>
        คาเฟ่เล็ก ๆ ที่เต็มไปด้วยความสุขและความสดใส<br>
        มาสร้างช่วงเวลาดี ๆ ไปด้วยกันนะ ♡
    </p>
</div>

<footer>
    ♡ Milky Mellow Cafe ♡
    <p>Sweet Moments, Happy Days</p>
</footer>

</body>
</html>
